[package]
name = "rustynes-cosim"
description = "RustyNES as a co-simulation oracle for an external HDL device-under-test"
# Spelled out rather than inherited: this package is deliberately OUTSIDE the
# workspace (see the `exclude` note in the root manifest), and an excluded package
# cannot use `field.workspace = true`.
#
# The duplication is PINNED, not merely noticed: `cosim_manifest_audit.rs` in
# `rustynes-test-harness` asserts these values still match the workspace's, so
# drift fails a test instead of accumulating quietly.
version = "2.6.7"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
authors = ["DoubleGate <parobek@gmail.com>"]
repository = "https://github.com/doublegate/RustyNES"
keywords = ["nes", "emulator", "fpga", "verilator", "co-simulation"]
categories = ["emulators", "development-tools::testing"]
publish = false

[lib]
# `rlib` so the golden-export binary and the crate's own tests can use the safe
# Rust API directly; `staticlib`/`cdylib` so a Verilator C++ testbench can link
# the same code through the C ABI. Same shape as `rustynes-libretro`, minus its
# artifact-name override — nothing downstream renames this one.
crate-type = ["rlib", "staticlib", "cdylib"]

# Duplicated from `[workspace.lints]` for the same reason as the package fields
# above, and pinned by the same audit -- so this crate cannot quietly hold itself
# to a lower standard than the rest of the project.
[lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[features]
# The ONE optional feature here, and it is OFF BY DEFAULT, which the crate's own
# test suite decided rather than taste.
#
# It is a DIAGNOSTIC, and its `rustynes-core` counterpart compiles out the v2.2.3
# fast dot path -- so enabling it by default changes what the DEFAULT build of
# this crate runs. `tests/fast_path_does_not_bypass_the_fetch_trace.rs` exists to
# prove the fast path records the same fetches as the general one, and it does
# that by running the ROM with the fast path on and off. Made default, the
# feature compiles the fast path away and that test fails: the property it
# guards becomes unobservable in the configuration `cargo test` uses.
#
# So the default build is the CONTROL, and the diagnostic is opt-in:
#     cargo run --features ppu-state-trace --bin nes_golden_export -- ... \
#         --ppu-state-trace CAP --pst-frames A:B
#
# That ordering is also what makes the output-neutrality claim in the dependency
# comment below testable rather than asserted -- exporting a golden with and
# without the feature gives byte-identical `obs.bin`, `index_fb.bin`, `ram.bin`
# and `ckpt.bin`, VERIFIED on `ppu-misc-2007-stress` at 60 frames.
default = []
ppu-state-trace = ["rustynes-core/ppu-state-trace"]

[dependencies]
# The trace features are NOT optional here. This crate exists to emit them, and a
# build without them would produce an oracle that silently exports nothing —
# exactly the "absence of a signal read as a signal" failure this project keeps
# catching. Making them mandatory means a misconfigured build fails to compile
# rather than producing empty goldens.
rustynes-core = { path = "../rustynes-core", features = [
    "cpu-boot-trace",
    "irq-timing-trace",
    # v2.5.4 (rung 3). The per-dot PPU bus-address capture the background-fetch
    # gate compares. Enabled here and NOWHERE else, for the same reason the two
    # above are: this crate is excluded from the workspace precisely so a trace
    # feature cannot unify into the accuracy battery's build of the core.
    "ppu-fetch-trace",
    # v2.4.9. Populates CycleRecord.pc, which is 0 without it -- so every
    # Observable the bus gate reads carried pc=0 and could not name the
    # instruction at a divergence. Enabled only after checking empirically
    # that it changes NOTHING else: see the comparison in the commit body.
    "cpu-instr-cycle-trace",
    # v2.5.1 (ADR 0038). Rung 2's sweep needs the same interrupt stimulus on both
    # sides; nothing else in the workspace enables this, and `cosim_manifest_audit`
    # asserts this crate stays excluded so cargo cannot unify it into the battery.
    "cosim-interrupt-inject",
    # v2.5.9 (rung 4). Reaches `rustynes-apu/debug-hooks`, whose per-CPU-cycle
    # `MixTrace` carries the five channels' INTEGER DAC inputs -- the rung-4
    # gate per `RustyNES_MiSTer/docs/rung4-apu.md`. The `f32` mix fields in the
    # same record are diagnostics and are deliberately NOT exported.
    #
    # The feature is compile-time; the runtime ARM is separate and default-off,
    # so enabling it here changes no emulated behaviour. That is VERIFIED, not
    # assumed: exporting a golden with and without it produces byte-identical
    # `obs.bin`, `index_fb.bin` and `ram.bin`.
    "debug-hooks",
    # v2.6.5. The per-dot PPU state fixture, used STRICTLY as a DIAGNOSTIC and
    # never as a gate -- `RustyNES_MiSTer/docs/rung3-ppu.md` fixes that
    # partition, because these fields are RustyNES's decomposition of the chip
    # and not pin-observable facts. It exists here to answer questions the
    # pin-observable surfaces cannot, such as which internal value a `$2007`
    # read composed its address from.
    #
    # UNLIKE the features above, this one is NOT obviously inert: it compiles
    # out the v2.2.3 fast dot path so the hook can see every dot. That path is
    # differential-tested bit-identical, so the OUTPUT should not move -- and
    # "should" is not the bar this file sets. Verified the same way
    # `debug-hooks` was: a golden exported with and without the feature is
    # byte-identical in `obs.bin`, `index_fb.bin` and `ram.bin`.
] }

sha2 = { version = "0.11", default-features = false }

[[bin]]
name = "nes_golden_export"
path = "src/bin/nes_golden_export.rs"
