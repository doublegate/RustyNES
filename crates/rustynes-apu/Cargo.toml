[package]
name = "rustynes-apu"
description = "Cycle-accurate Ricoh 2A03 APU (Audio Processing Unit) for the NES"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["nes", "2a03", "apu", "audio", "emulator"]
categories = ["emulators", "multimedia::audio"]

[lints]
workspace = true

[features]
# Opt-in `std` for the APU mixer's `f32::exp` (filter coefficient init).
# When OFF, the same call routes through `libm::expf` so the crate compiles
# on no_std targets like `thumbv7em-none-eabihf`. The numeric output matches
# `f32::exp` to the precision we use. `rustynes-core` activates this via its own
# `std` default. See `docs/architecture.md` §no_std boundary. We do NOT
# `default = ["std"]` here because cargo's workspace feature unification
# would then quietly opt every consumer in to `std`, masking no_std regressions
# from cross-target CI gates that build with `--no-default-features`.
std = []
# v2.3.7 "Overtone" — audio provenance: per-register write attribution (which
# instruction wrote `$4000-$4017`) and a per-CPU-cycle trace of the channel
# outputs actually mixed. Mirrors `rustynes-ppu/debug-hooks`, and like it the
# feature is only half the gate: `rustynes-core` forwards it and the frontend
# enables it unconditionally, so **the thing that is default-off is the runtime
# ARM**, a lazily-allocated `Option` whose disarmed cost is one discriminant
# test per register write and per mixed cycle. Output-only: nothing here is read
# back into synthesis or carried in the save state, so the shipped default is
# byte-identical and the determinism contract is untouched.
debug-hooks = []

[dependencies]
bitflags.workspace = true
thiserror.workspace = true
libm = { version = "0.2", default-features = false }

[dev-dependencies]
proptest.workspace = true
pretty_assertions.workspace = true
criterion.workspace = true
# Real-to-complex FFT for the BLEP spectral regression test
# (`tests/spectral.rs` + `benches/spectral.rs`). Pure-Rust, dev-only —
# does NOT propagate to consumer builds.
realfft = "3.4"

[[bench]]
name = "spectral"
path = "benches/spectral.rs"
harness = false

[[bench]]
name = "apu_throughput"
path = "benches/apu_throughput.rs"
harness = false
