[package]
name = "rustynes-cheevos"
version.workspace = true
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
authors = ["Parobek <parobek@gmail.com>"]
repository.workspace = true
description = "Native-only RetroAchievements (rcheevos) FFI wrapper for RustyNES"
publish = false

# This crate vendors and links the rcheevos C library, so unsafe is required.
# Override the workspace-wide `unsafe_code = "warn"` lint.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[build-dependencies]
cc = "1"

# HTTP transport is native-only. The whole crate body is gated on
# `cfg(not(target_arch = "wasm32"))`, so a wasm workspace build sees an
# empty crate and never pulls these in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
# `libc::time_t` for the rcheevos structs' `time_t` fields: 64-bit on the
# default targets, but 32-bit on 32-bit Android (armeabi-v7a, opt-in in
# `android/app/build.gradle.kts`) and 32-bit glibc, where a hard-coded `i64`
# would shift every later field and grow the struct.
libc = "0.2.189"
