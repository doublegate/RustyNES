name: Security

# Dependency-vulnerability scan (cargo-audit) + licence / advisory / source
# policy (cargo-deny) + an extended clippy gate.
#
# Pure-documentation pushes are skipped: they cannot change Cargo.lock or any
# `.rs` code, so there is nothing for these jobs to find. The weekly `schedule`
# cron still re-runs the full suite, so a NEW advisory published against an
# unchanged dependency is caught even when no code is pushed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "screenshots/**"
      - "LICENSE*"
      - "NOTICE"
      - ".gitignore"
      - ".codegraph/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "screenshots/**"
      - "LICENSE*"
      - "NOTICE"
      - ".gitignore"
      - ".codegraph/**"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

# Cancel superseded PR runs; let every `main` commit finish.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Least-privilege default: the audit / deny / clippy-security jobs only read the
# checked-out tree (cargo-audit, cargo-deny, clippy) — none uploads SARIF or
# writes to the repo — so the default GITHUB_TOKEN is narrowed to read-only.
# Resolves the CodeQL `actions/missing-workflow-permissions` alerts (one per job).
permissions:
  contents: read

# Every job carries an explicit `timeout-minutes`, for the reason PR #400
# established for `ci.yml` and this file was missed by: without one a job
# inherits GitHub's SIX-HOUR default, and a hung job then blocks a release while
# reporting nothing at all. That is not hypothetical here — `Clippy Security
# Lints` hung for over two hours during the v2.3.7 cut, in a setup step, on a
# job whose observed runtime is 2-3 minutes, and the release waited on it.
#
# Budgets are generous multiples of observed runtime (audit and deny complete in
# under a minute, clippy in 2-3), because the purpose is to bound a hang, not to
# police normal variance on a cold cache.
jobs:
  # What each job reads, so a PR runs only the jobs its diff can affect
  # (2026-09-23). `cargo audit` and `cargo deny` read the dependency graph --
  # the manifests, the lockfile, `deny.toml` -- and nothing else, so a PR that
  # does not change one of those cannot change their verdict; the Monday cron
  # is what catches an advisory published against an UNCHANGED lockfile, and
  # it keeps doing so. The clippy job reads Rust source. `main` pushes, the
  # cron and dispatch run everything: the filter applies to PRs only. This
  # workflow is not a required check, so a skipped job blocks nothing.
  changes:
    name: detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deps:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/security.yml'
            rust:
              - 'crates/**'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/actions/**'
              - '.github/workflows/security.yml'

  audit:
    name: Dependency Audit
    needs: changes
    # `!cancelled()`, not `always()`: a push / cron run, where `changes` is
    # skipped, still runs, and a `changes` job that did not succeed runs
    # everything rather than nothing -- the filter may only ever skip work,
    # never lose a gate -- but a run the user cancelled starts nothing new.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Install the PREBUILT binary, never `cargo install` (build-from-source):
      #  1. compiling the tool on every run dwarfs downloading it, and
      #  2. `rust-toolchain.toml` is a directory override, so a build-from-source
      #     install is subject to this repo's rustc pin -- if a tool's own MSRV
      #     ever rises above that pin, the SECURITY gate is what breaks. The
      #     prebuilt binary only parses `Cargo.lock` and runs under any toolchain.
      # Reason 2 was an ACTIVE constraint until the v1.3.0 pin bump (1.86 vs
      # cargo-audit's 1.88); it is slack today and can bind again after an MSRV
      # change in either direction, so it is kept rather than deleted as history.
      - uses: taiki-e/install-action@v2.87.15
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: Cargo Deny Check
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Prebuilt binary for the same two reasons as the audit job above: it is
      # much faster than compiling cargo-deny, and it keeps the security gate
      # independent of this repo's rustc pin. Policy lives in `deny.toml`.
      - uses: taiki-e/install-action@v2.87.15
        with:
          tool: cargo-deny
      - run: cargo deny check

  clippy-security:
    name: Clippy Security Lints
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          cache-key: security-clippy
      # The one frontend feature no other clippy invocation reaches is
      # `gpu-timing` (the wgpu TIMESTAMP_QUERY readback path), so that is all
      # this job lints, and only on the crate that owns it.
      #
      # It used to run `clippy --workspace --all-targets` with
      # `retroachievements,gpu-timing`: a SECOND full workspace compile
      # (~2 min) whose `retroachievements` half ci.yml's lint job already
      # covers twice, once on its own and once inside `--features full`.
      # `full` does not include `gpu-timing` (see rustynes-frontend's
      # Cargo.toml), which is why this job still exists at all.
      #
      # NOTE: the previous `-W clippy::unwrap_used -W clippy::expect_used`
      # restriction lints were removed. Under `-D warnings` they promote EVERY
      # legitimate `.unwrap()`/`.expect()` (hot paths, tests, build scripts) to
      # a hard error, which is what kept this job permanently red. `-D warnings`
      # alone is the meaningful, reliable security / quality gate.
      - name: Run clippy (-D warnings) on the gpu-timing feature
        run: |
          cargo clippy -p rustynes-frontend --all-targets \
            --features gpu-timing \
            -- -D warnings
