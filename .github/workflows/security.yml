name: Security

# Dependency-vulnerability scan (cargo-audit) + licence / advisory / source
# policy (cargo-deny) + an extended clippy gate.
#
# Pure-documentation pushes are skipped: they cannot change Cargo.lock or any
# `.rs` code, so there is nothing for these jobs to find. The weekly `schedule`
# cron still re-runs the full suite, so a NEW advisory published against an
# unchanged dependency is caught even when no code is pushed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "screenshots/**"
      - "LICENSE*"
      - "NOTICE"
      - ".gitignore"
      - ".codegraph/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "screenshots/**"
      - "LICENSE*"
      - "NOTICE"
      - ".gitignore"
      - ".codegraph/**"
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

# Cancel superseded PR runs; let every `main` commit finish.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Least-privilege default: the audit / deny / clippy-security jobs only read the
# checked-out tree (cargo-audit, cargo-deny, clippy) — none uploads SARIF or
# writes to the repo — so the default GITHUB_TOKEN is narrowed to read-only.
# Resolves the CodeQL `actions/missing-workflow-permissions` alerts (one per job).
permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Install the PREBUILT binary, never `cargo install` (build-from-source).
      # Two reasons, and the ORDER matters because only the first is always true:
      #
      #  1. Speed. `cargo install cargo-audit` compiles a large dependency tree
      #     on every run; the prebuilt binary is a download and an extract.
      #
      #  2. It decouples the security gate from the project's toolchain pin.
      #     `rust-toolchain.toml` is a directory override, so a build-from-source
      #     install is subject to whatever rustc this repo pins -- and if the
      #     tool's own MSRV ever rises above that pin, the SECURITY gate is what
      #     breaks. The prebuilt binary is immune: it only parses `Cargo.lock`,
      #     it never compiles the project, and it runs under any toolchain.
      #
      # Reason 2 was an ACTIVE constraint until v1.3.0, when the pin was 1.86 and
      # cargo-audit already required 1.88. It is slack today (the pin is 1.96)
      # and could bind again after any MSRV change in either direction. The
      # comment this replaces still asserted it as present-tense fact -- "the
      # repo pins rustc 1.96 ... BUT cargo-audit needs >= 1.88 to compile" --
      # which stopped being true at the bump and reads as a non-sequitur now,
      # since 1.96 satisfies >= 1.88. A reader could reasonably conclude the
      # constraint had lifted and switch to `cargo install`, losing reason 1.
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: Cargo Deny Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Prebuilt binary for the same two reasons as the audit job above: it is
      # much faster than compiling cargo-deny, and it keeps the security gate
      # independent of this repo's rustc pin. Policy lives in `deny.toml`.
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-deny
      - run: cargo deny check

  clippy-security:
    name: Clippy Security Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          cache-key: security-clippy
      # The main CI `lint` job already runs `clippy -D warnings` on the DEFAULT
      # feature set. This job extends that exact gate to the two non-default,
      # security- / FFI-relevant frontend features the default build never
      # compiles (and which therefore rot silently):
      #   * retroachievements - the RA HTTP client + the vendored rcheevos C FFI
      #   * gpu-timing         - the wgpu TIMESTAMP_QUERY readback path
      # so a clippy regression in either feature-gated path fails here.
      #
      # NOTE: the previous `-W clippy::unwrap_used -W clippy::expect_used`
      # restriction lints were removed. Under `-D warnings` they promote EVERY
      # legitimate `.unwrap()`/`.expect()` (hot paths, tests, build scripts) to
      # a hard error, which is what kept this job permanently red. `-D warnings`
      # alone is the meaningful, reliable security / quality gate.
      - name: Run clippy (-D warnings) incl. RA + GPU-timing features
        run: |
          cargo clippy --workspace --all-targets \
            --features rustynes-frontend/retroachievements,rustynes-frontend/gpu-timing \
            -- -D warnings
