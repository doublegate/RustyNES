name: Release

# Triggered on push of a version tag (e.g. v1.0.0, v1.0.1-rc1). Also exposed
# via workflow_dispatch for manual debugging from the Actions tab.
#
# Each matrix entry builds the `rustynes` binary in release mode, strips it
# (where applicable), bundles it with the README and both LICENSE files, and
# uploads the resulting archive to the GitHub Release matching the pushed tag.
#
# Assets are attached with `gh release upload --clobber` (since v3.2.0; see
# the upload step for why softprops/action-gh-release was dropped).
# Permissions are minimum-necessary (contents: write only).
#
# Linux musl + cross-compiled aarch64 Linux are intentionally NOT in the matrix
# for the v1.0 cut: Sprint 5-3's exit criterion is "binary builds and runs on
# Linux/macOS/Windows", not "all libc variants". Adding musl would pull in
# cross-rs + vendored OpenSSL plumbing that is out of scope for this sprint.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0). Used only on workflow_dispatch."
        required: true
        type: string
  # Invoked by `release-auto.yml` after a new version goes final-green on main.
  # A tag pushed by the built-in GITHUB_TOKEN does NOT trigger `on: push: tags`
  # (GitHub's recursion guard), so the auto-release path calls this workflow
  # directly via `uses:` rather than relying on the tag-push event.
  workflow_call:
    inputs:
      tag:
        description: "Tag to build + attach assets to (e.g. v1.9.9)."
        required: true
        type: string

# Don't kill a release mid-build if a second tag lands on the same ref.
# Keyed on the bare tag name: a tag push's `github.ref_name` and a dispatch's
# `inputs.tag` are both `vX.Y.Z`, so two runs for one release share a group
# and cannot `--clobber` each other's assets (CodeRabbit on #609). Give a
# dispatch the bare tag, as the input's description says.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # v3.4.1: bake the deployed hosted services (lobby + TURN credentials,
  # services/hosted/) into every shipped build. `rustynes-netplay` reads it
  # with option_env!, so it is a COMPILE-time setting; a build without it
  # keeps the v3.4.0 behaviour (no hosted base, direct and LAN play only).
  # A user's `hosted_base_url` config still overrides it. ci.yml leaves it
  # unset on purpose: hosted.rs's default-behaviour test needs it absent.
  RUSTYNES_HOSTED_BASE: "https://rustynes-hosted.parobek.workers.dev"
  RUST_BACKTRACE: 1

jobs:
  # A tag push has no release yet (Auto Release creates one before it calls
  # this workflow; a re-build dispatched for an existing tag finds one), and
  # `gh release upload` cannot create it, which the softprops action used to
  # do. Create it once, ONLY when absent, so an existing release and its notes
  # are never touched (Copilot and agy on #609).
  ensure-release:
    name: ensure the release exists
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release if this tag has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$GITHUB_REF}"
          tag="${tag#refs/tags/}"
          # Only "not found" means absent. Any other failure (rate limit, 5xx,
          # token) stops here with its own message instead of falling through
          # to a create that would fail with a misleading second error.
          if out=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "release $tag exists; left as it is"
          elif grep -qi "release not found" <<<"$out"; then
            # A tag with a suffix (v1.0.1-rc1) is a candidate, not a release.
            pre=()
            case "$tag" in *-*) pre=(--prerelease) ;; esac
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$tag" --notes "" "${pre[@]}"
            echo "created release $tag ${pre[*]}"
          else
            echo "$out" >&2
            exit 1
          fi

  build:
    needs: ensure-release
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # 30 minutes is ~6x the historical aarch64-apple-darwin build wall-clock
    # (~2.5 min) and ~4x the cold-cache Linux/Windows time. The Intel macOS
    # job in particular was hanging indefinitely in the runner queue (24h+
    # before manual cancel) when targeting the deprecated `macos-13` label;
    # an explicit timeout ensures any future runner-allocation regression
    # fails fast instead of squatting the release queue.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            bin_name: rustynes
          # x86_64-apple-darwin was DROPPED in v1.6.0 (ADR 0009). The only
          # remaining Intel macOS runner label (`macos-15-intel`) is GitHub's
          # last x86_64 macOS image and is scheduled for removal in August 2027
          # (actions/runner-images#13045). Rather than carry a time-bomb or take
          # on cargo-zigbuild cross-compile + macOS-SDK-vendoring complexity for
          # a shrinking cohort, the release matrix ships aarch64 macOS only;
          # Intel-Mac users build from source (`cargo build --release -p
          # rustynes-frontend`). See docs/adr/0009-drop-x86_64-darwin-release-target.md.
          # v3.0.1: macos-14 is deprecated (runner-images#13518: brownouts
          # from 2026-10-05, unsupported from 2026-11-02); macos-15 is the
          # next Apple-silicon image, still aarch64.
          - os: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: rustynes
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_name: rustynes.exe
    steps:
      # Check out the TAG, not the triggering ref. On workflow_dispatch the
      # ref is the branch the run was started from (main), so without this a
      # re-build of an existing tag compiled main's HEAD and attached it
      # under the tag's name. On a tag push `inputs.tag` is empty and
      # `github.ref` is the tag; on workflow_call it is the tag Auto Release
      # just created. Qualified as `refs/tags/`, so a branch of the same name
      # can never be checked out instead (CodeRabbit on #609); give a
      # dispatch the bare tag.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      # Shared toolchain + Linux deps (no-op on macOS/Windows) + cargo cache.
      # The per-target cache key keeps each platform's artifacts separate.
      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          # `inputs.tag` is set for workflow_dispatch AND workflow_call; on a
          # tag push it is empty, so fall back to the pushed ref. Read through
          # `env`, not interpolated into the script, and stripped of a
          # `refs/tags/` prefix either way, so a dispatch given the full ref
          # names its archive and its upload by the bare tag (agy on #609).
          tag="${INPUT_TAG:-$GITHUB_REF}"
          tag="${tag#refs/tags/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${tag}"

      # v2.9.7 (maintainer decision, 2026-09-30): the release binary is the
      # `full` build -- RetroAchievements, Lua scripting (+ IPC), HD packs,
      # A/V recording and the debug hooks, added on top of the default
      # features. One archive per platform, under the same name as before.
      # None of these needs a system library at build time: rcheevos and Lua
      # are vendored C built with `cc`, HTTP is rustls (no OpenSSL), and A/V
      # recording runs an `ffmpeg` binary at RUN time and reports its absence.
      # The Cargo default feature set is unchanged: `full` is native-only, and
      # the wasm build and a plain `cargo build` keep today's defaults.
      # CI's `full-build` job compiles this feature set on macOS and Windows on
      # every ready PR, so a release is never the first build of it there.
      - name: Build release binary
        run: cargo build --release -p rustynes-frontend --features full --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: strip "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"

      - name: Stage archive contents
        shell: bash
        run: |
          stage="rustynes-${{ steps.tag.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "$stage/"
          cp README.md LICENSE NOTICE CHANGELOG.md "$stage/"
          echo "stage=${stage}" >> "$GITHUB_ENV"

      - name: Create archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          tar -czf "${stage}.tar.gz" "${stage}"
          echo "asset=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Create archive (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:stage" -DestinationPath "$env:stage.zip"
          "asset=$env:stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # The release body is owned by Auto Release's notes (or the
      # maintainer); this step only attaches the build artifact. The
      # softprops action that preceded it rewrote the body on every matrix
      # target when given `body:` (v1.0.0 and v1.1.0 lost hand-written notes
      # that way), which an upload cannot do.
      #
      # `gh release upload`, not softprops/action-gh-release (v3.2.0). That
      # action calls `updateRelease` (tag, target, name, body) on an existing
      # release before uploading, and at v3.2.0 GitHub refused the update to
      # the workflow token on all three targets, twice ("Resource not
      # accessible by integration"), so no binary was attached; v3.1.0's
      # identical step had passed. The likeliest difference is that v3.2.0's
      # tagged commit changes `.github/workflows/`, which a GITHUB_TOKEN
      # without the `workflows` permission may not re-target a release to.
      # Uploading an asset never updates the release, needs only
      # `contents: write`, and is what the PGO step below already uses;
      # `--clobber` makes a re-run replace its own asset instead of failing
      # on the duplicate name.
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          : "${asset:?the archive step did not set asset}"
          gh release upload "$TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"

  # --------------------------------------------------------------------------
  # PGO build + promotion gate (linux x86_64 only).
  #
  # Runs the full instrument -> train -> optimized-rebuild cycle and its two
  # gates (>3% faster on `full_frame` AND byte-identical across the whole
  # `--features test-roms` oracle). Before v2.2.3 this ran on the same tag push
  # as the release but nothing consumed the result — a promoted binary was
  # computed and discarded. Now `pgo-linux-asset` below ships it.
  #
  # FAILURE SEMANTICS (note: `continue-on-error` is NOT permitted on a
  # reusable-workflow `uses:` job — actionlint rejects it — so the tolerance
  # lives inside pgo.yml instead):
  #
  #   * A GATE verdict (slower than the 3% bar, or an oracle divergence) is not
  #     a failure at all. pgo.yml's determinism step carries a step-level
  #     `continue-on-error`, so the gate simply reports promotable=false, this
  #     job stays green, and `pgo-linux-asset` below is skipped.
  #   * An INFRASTRUCTURE failure (runner died, cargo-pgo unavailable) does mark
  #     this job — and therefore the run — red. That is deliberate: a broken PGO
  #     pipeline should be visible, not swallowed. The RELEASE is still correct
  #     either way: `build` has already attached the plain assets for all three
  #     targets, and the replacement job below is skipped.
  #
  # Scope is deliberately linux-x86_64 ONLY — PGO training has to RUN the
  # instrumented binary, so each additional target needs its own native runner
  # doing a full train cycle. macOS-aarch64 and Windows keep shipping plain
  # release builds; extending PGO to them is a separate decision with a real
  # cost (~90 min of runner time each), not a freebie.
  pgo:
    name: PGO build + gate (linux x86_64)
    # After the release check, so a bad tag stops before 90 minutes of PGO.
    needs: ensure-release
    # pgo.yml builds the TRIGGERING commit (GITHUB_SHA). That is the tag's
    # only on a tag push. On Auto Release's `workflow_run` call it is main's
    # tip when the run started, usually the tag's commit but not always, and
    # on a dispatched re-build it is main's HEAD. A dispatched re-build
    # therefore skips PGO, and `pgo-linux-asset` ships a PGO binary only when
    # GITHUB_SHA equals the tag's commit (Cursor on #609), otherwise keeping
    # the plain binary. pgo.yml is not handed a ref instead: checking out a
    # caller-chosen ref there and running it with the default branch's cache
    # is what CodeQL reports as cache poisoning (5 high alerts on #609's
    # first form).
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/pgo.yml
    # v3.4.1: the same base as the workflow-level env above. A literal because
    # `env` is not an allowed context in a reusable workflow's `with:`; the two
    # must name the same URL, which release_anchor_audit checks.
    with:
      hosted_base: "https://rustynes-hosted.parobek.workers.dev"
    permissions:
      contents: read

  # Replace the Linux release asset with the PGO binary when — and only when —
  # the gate promoted it.
  #
  # Sequencing note: `build` attaches the plain Linux archive first (it finishes
  # in ~10 min; the PGO job takes up to 90), so for the intervening window the
  # release carries the plain binary and is then upgraded in place. That is the
  # deliberate trade: the release is complete and downloadable immediately
  # rather than gated behind an hour and a half of PGO, and the swap is
  # idempotent. The archive keeps the SAME name, so download links and
  # checksums-by-name do not change shape.
  pgo-linux-asset:
    name: Ship PGO binary as the linux asset
    needs: [build, pgo]
    if: needs.pgo.outputs.promotable == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Check out the TAG, not the triggering ref. On workflow_dispatch the
      # ref is the branch the run was started from (main), so without this a
      # re-build of an existing tag compiled main's HEAD and attached it
      # under the tag's name. On a tag push `inputs.tag` is empty and
      # `github.ref` is the tag; on workflow_call it is the tag Auto Release
      # just created. Qualified as `refs/tags/`, so a branch of the same name
      # can never be checked out instead (CodeRabbit on #609); give a
      # dispatch the bare tag.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          # Same resolution as the `build` job: `inputs.tag` on
          # workflow_dispatch / workflow_call, else the pushed ref.
          tag="${INPUT_TAG:-$GITHUB_REF}"
          tag="${tag#refs/tags/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # pgo.yml built the TRIGGERING commit (GITHUB_SHA), which on Auto
      # Release's `workflow_run` path is main's HEAD when the run started, not
      # necessarily the tag: a commit merged after the release would be
      # trained and shipped under the release's name. This job checked out
      # the tag, so HEAD is the tag's commit; ship only when the two agree,
      # and otherwise keep the plain binary `build` attached (security review
      # of #609).
      - name: Ship only a PGO build of the tag's own commit
        id: same
        shell: bash
        run: |
          set -euo pipefail
          tag_sha=$(git rev-parse HEAD)
          if [ "$tag_sha" = "$GITHUB_SHA" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PGO built $GITHUB_SHA, but the tag is $tag_sha; the plain Linux binary stays."
          fi

      - name: Download the promoted PGO binary
        if: steps.same.outputs.same == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.pgo.outputs.artifact }}
          path: pgo-bin

      - name: Stage + archive (identical layout to the plain Linux asset)
        if: steps.same.outputs.same == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          target="x86_64-unknown-linux-gnu"
          stage="rustynes-${TAG}-${target}"
          mkdir -p "$stage"
          cp pgo-bin/rustynes "$stage/rustynes"
          chmod +x "$stage/rustynes"
          strip "$stage/rustynes"
          cp README.md LICENSE NOTICE CHANGELOG.md "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          echo "asset=${stage}.tar.gz" >> "$GITHUB_ENV"

      # `--clobber`, as in the `build` job's upload: here it is required, not
      # just convenient, because this REPLACES an asset `build` already
      # attached under the same name, and the API rejects a duplicate asset name without an
      # explicit overwrite. `--clobber` is that overwrite.
      - name: Replace the Linux asset with the PGO build
        if: steps.same.outputs.same == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SPEEDUP: ${{ needs.pgo.outputs.speedup_pct }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          {
            echo "### PGO binary shipped"
            echo
            echo "The \`x86_64-unknown-linux-gnu\` release asset is the"
            echo "profile-guided-optimized build (**${SPEEDUP}%** faster on"
            echo "\`full_frame\`, byte-identical across the full test-roms oracle)."
          } >> "$GITHUB_STEP_SUMMARY"
