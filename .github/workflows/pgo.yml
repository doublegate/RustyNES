name: PGO

# Profile-guided-optimization (PGO) build + promotion gate for the shipping
# `rustynes` binary. This is the CI face of `scripts/pgo/run.sh`
# (instrument -> train on the committed CC0/MIT corpus -> optimized rebuild).
#
# DELIBERATELY NOT per-PR / per-push: an instrument+train+rebuild cycle compiles
# the workspace twice plus a multi-ROM training sweep — far too slow for the PR
# gate (that's the fast `bench` job in ci.yml). It runs ONLY on:
#   * workflow_dispatch  — manual, from the Actions tab; and
#   * workflow_call      — invoked BY `release.yml`, which ships the promoted
#                          binary as the Linux release asset (see below).
#
# WHY NOT `push: tags` ANY MORE (v2.2.3). It used to also trigger on a `v*` tag
# push, "alongside release.yml, so a release can consider shipping the PGO
# binary" — except nothing ever consumed the result, so the gate computed a
# promotable artifact that was then thrown away. `release.yml` now calls this
# workflow directly and uses its output. Keeping the tag trigger as well would
# start a SECOND, redundant 90-minute run for every manually-pushed tag (the
# auto-release path pushes tags with GITHUB_TOKEN, which does not re-trigger
# `on: push`, so that path would have been fine — but a hand-pushed tag would
# double up). One entry point per tag is the whole point.
#
# PROMOTION GATE (both conditions, AND):
#   1. FASTER  — the PGO `full_frame` criterion mean must beat the plain-release
#                baseline by > 3% (a Criterion-stable margin above shared-runner
#                noise; the ci.yml bench gate's absolute ceiling does NOT apply
#                here — this is a relative A/B on the SAME runner, back to back).
#   2. BYTE-IDENTICAL — the PGO codegen must produce bit-identical emulation
#                output. PGO changes inlining + code layout, not FP semantics
#                (Rust emits no fast-math), but we PROVE it: the determinism
#                stage rebuilds + runs the full `--features test-roms` oracle
#                (AccuracyCoin 141/141, nestest 0-diff, blargg/kevtris, the
#                golden-framebuffer visual_regression + audio mixer suites) with
#                the MERGED PGO profile applied (`cargo pgo optimize test`). Any
#                framebuffer/audio/cycle-hash divergence fails the stage.
#
# The PGO artifact is uploaded + the run is marked "promotable" ONLY when BOTH
# pass. A failure of either is informational on workflow_dispatch (the plain
# release binary in release.yml is unaffected) and never blocks a release.

on:
  workflow_dispatch:
    inputs:
      frames:
        description: "Training frames per ROM (default 3600 = 60 s NTSC each)."
        required: false
        default: "3600"
        type: string
      run_bolt:
        description: "Also try the BOLT post-link stage (Linux only, best-effort)."
        required: false
        default: false
        type: boolean
  # Invoked by `release.yml` on a version tag. The caller consumes
  # `outputs.promotable` + `outputs.artifact` to ship the PGO binary as the
  # Linux release asset when the gate passes.
  workflow_call:
    inputs:
      frames:
        description: "Training frames per ROM (default 3600 = 60 s NTSC each)."
        required: false
        default: "3600"
        type: string
    outputs:
      promotable:
        description: "'true' when the PGO build cleared BOTH the >3% speedup bar and the byte-identical determinism oracle."
        value: ${{ jobs.pgo.outputs.promotable }}
      speedup_pct:
        description: "Measured full_frame speedup of PGO vs plain release, in percent."
        value: ${{ jobs.pgo.outputs.speedup_pct }}
      artifact:
        description: "Name of the uploaded PGO-binary artifact (empty unless promotable)."
        value: ${{ jobs.pgo.outputs.artifact }}

# Never cancel an in-flight PGO run; let each finish so its A/B numbers + the
# determinism proof land in the log.
concurrency:
  group: pgo-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # > 3% promotion bar (relative full_frame speedup of PGO vs plain release).
  PGO_MIN_SPEEDUP_PCT: "3.0"

jobs:
  pgo:
    name: PGO build + gate (linux x86_64)
    runs-on: ubuntu-latest
    # Instrument build + training sweep + optimized rebuild + the test-roms
    # oracle is the heaviest job in the repo; give it generous headroom over the
    # ~30 min release builds.
    timeout-minutes: 90
    outputs:
      promotable: ${{ steps.gate.outputs.promotable }}
      speedup_pct: ${{ steps.gate.outputs.speedup_pct }}
      # Empty unless promotable — the upload step below is gated on the same
      # condition, so a caller that downloads this name only ever does so when
      # the artifact actually exists.
      artifact: ${{ steps.triple.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned to the project toolchain (rust-toolchain.toml = 1.96.0), matching
      # the other jobs. PGO needs the llvm-tools-preview component (profdata
      # merge) and the wgpu/winit/cpal apt deps (the optimized rebuild links the
      # full `rustynes-frontend` binary).
      - uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
          cache-key: pgo

      - name: Install cargo-pgo
        run: cargo install cargo-pgo --locked

      # ---- Stage 1: plain-release baseline -------------------------------
      # Same bench the ci.yml gate + docs/performance.md use. Save a Criterion
      # baseline named `plain` so stage 4 can A/B against it on this same runner.
      - name: Baseline — plain release full_frame bench
        run: |
          cargo bench -p rustynes-core --bench full_frame -- \
            --warm-up-time 1 --measurement-time 5 --save-baseline plain

      - name: Capture baseline mean (ns)
        id: baseline
        run: |
          est="target/criterion/nes_run_frame_nestest/plain/estimates.json"
          mean="$(python3 -c "import json,sys;print(int(json.load(open(sys.argv[1]))['mean']['point_estimate']))" "$est")"
          echo "mean_ns=${mean}" >> "$GITHUB_OUTPUT"
          echo "baseline nes_run_frame_nestest mean = ${mean} ns"

      # ---- Stage 2: instrument -> train -> optimized rebuild -------------
      # scripts/pgo/run.sh: `cargo pgo build` (instrumented trainer + core),
      # runs `pgo_trainer` over the committed corpus, then
      # `cargo pgo optimize build -- -p rustynes-frontend`. The optimized
      # `rustynes` binary lands at target/<triple>/release/rustynes.
      # `inputs.frames` (NOT `github.event.inputs.frames`): the latter is
      # populated only for `workflow_dispatch` and is empty on `workflow_call`,
      # which would silently drop the caller's value. The `inputs.` context
      # covers both triggers. Bound through `env:` rather than interpolated
      # into the command string.
      - name: PGO instrument + train + optimized rebuild
        env:
          PGO_FRAMES: ${{ inputs.frames || '3600' }}
        run: scripts/pgo/run.sh "$PGO_FRAMES"

      # ---- Stage 3: PGO full_frame bench (A/B vs the `plain` baseline) ---
      - name: PGO full_frame bench
        run: |
          cargo pgo optimize bench -- -p rustynes-core --bench full_frame -- \
            --warm-up-time 1 --measurement-time 5 --save-baseline pgo

      # ---- Stage 4: byte-identical determinism oracle (the hard gate) ----
      # Rebuild + run the FULL test-roms oracle with the MERGED PGO profile
      # applied. AccuracyCoin 141/141, nestest golden-log 0-diff, blargg/kevtris,
      # the golden-framebuffer visual_regression suite + the APU mixer/volume
      # audio suites all assert byte-exact values — if PGO codegen perturbed any
      # framebuffer/audio/cycle hash, this fails and blocks promotion.
      # `continue-on-error` so a determinism DIVERGENCE is a gate verdict, not a
      # job crash: the gate step below already reads `oracle_ok` and treats an
      # unset value as FAIL, which is what the workflow header has always
      # claimed ("a failure of either is informational"). Without this the job
      # died here and the gate never ran — and now that `release.yml` calls this
      # workflow, that would redden a release whose assets are perfectly fine.
      - name: Determinism oracle (test-roms, PGO-optimized codegen)
        id: oracle
        continue-on-error: true
        run: |
          set -o pipefail
          cargo pgo optimize test -- --workspace --release --features test-roms \
            2>&1 | tee oracle.log
          echo "oracle_ok=true" >> "$GITHUB_OUTPUT"

      # ---- Stage 5: compute delta + decide promotion --------------------
      - name: Compute speedup + promotion decision
        id: gate
        run: |
          base_ns="${{ steps.baseline.outputs.mean_ns }}"
          pgo_est="target/criterion/nes_run_frame_nestest/pgo/estimates.json"
          pgo_ns="$(python3 -c "import json,sys;print(int(json.load(open(sys.argv[1]))['mean']['point_estimate']))" "$pgo_est")"
          speedup="$(python3 -c "print(f'{(1 - ${pgo_ns}/${base_ns})*100:.2f}')")"
          echo "speedup_pct=${speedup}" >> "$GITHUB_OUTPUT"

          {
            echo "### PGO promotion gate"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Baseline (plain) nes_run_frame_nestest | ${base_ns} ns |"
            echo "| PGO nes_run_frame_nestest | ${pgo_ns} ns |"
            echo "| Speedup | ${speedup}% |"
            echo "| Threshold | > ${PGO_MIN_SPEEDUP_PCT}% |"
            echo "| Oracle byte-identical | ${{ steps.oracle.outputs.oracle_ok == 'true' && 'PASS' || 'FAIL' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          faster="$(python3 -c "print('1' if ${speedup} > ${PGO_MIN_SPEEDUP_PCT} else '0')")"
          if [ "${faster}" = "1" ] && [ "${{ steps.oracle.outputs.oracle_ok }}" = "true" ]; then
            echo "promotable=true" >> "$GITHUB_OUTPUT"
            echo "PROMOTE: PGO is ${speedup}% faster (> ${PGO_MIN_SPEEDUP_PCT}%) AND byte-identical." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "promotable=false" >> "$GITHUB_OUTPUT"
            echo "NO PROMOTE: speedup ${speedup}% (need > ${PGO_MIN_SPEEDUP_PCT}%) / oracle=${{ steps.oracle.outputs.oracle_ok }}." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # ---- Stage 6: upload the PGO binary ONLY when promotable ----------
      - name: Resolve target triple
        id: triple
        env:
          PROMOTABLE: ${{ steps.gate.outputs.promotable }}
        run: |
          triple="$(rustc -vV | sed -n 's/host: //p')"
          echo "triple=${triple}" >> "$GITHUB_OUTPUT"
          # Publish the artifact NAME only when the gate promoted, so the
          # caller's `if:` and its `download-artifact` name agree by
          # construction rather than by two places staying in sync.
          if [ "$PROMOTABLE" = "true" ]; then
            echo "artifact=rustynes-pgo-${triple}" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload promoted PGO binary
        if: steps.gate.outputs.promotable == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rustynes-pgo-${{ steps.triple.outputs.triple }}
          path: target/${{ steps.triple.outputs.triple }}/release/rustynes
          if-no-files-found: error

  # ---- Optional Linux-only BOLT post-link stage ----------------------------
  # Behind the SAME > 3% + byte-identical gate, gated further on the PGO stage
  # having already promoted (BOLT chains onto the PGO binary). Best-effort:
  # skips cleanly if `llvm-bolt` is unavailable on the runner image.
  bolt:
    name: BOLT post-link (linux, best-effort)
    needs: pgo
    # Explicit opt-in ONLY. Previously this ran whenever the PGO stage promoted
    # and the event was not a workflow_dispatch-without-run_bolt — which, now
    # that `release.yml` calls this workflow, would fire BOLT on every release
    # and add ~90 minutes for an artifact nothing consumes (the release ships
    # the PGO binary, not the BOLT one). BOLT stays the opt-in experiment it
    # has always been in practice.
    if: >-
      needs.pgo.outputs.promotable == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.run_bolt == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
          cache-key: pgo-bolt
      - name: Install cargo-pgo
        run: cargo install cargo-pgo --locked

      # Probe for llvm-bolt by LOCATING THE BINARY, never by trusting a package
      # manager's exit code.
      #
      # The previous form did `apt-get install -y bolt` and set have_bolt=true if
      # that succeeded. On Ubuntu the package named `bolt` is the **Thunderbolt 3
      # device manager** — an unrelated project that happens to own the name. apt
      # installed it, exited 0, the probe reported success, and the stage then
      # died on `Cannot find llvm-bolt: cannot find binary path` (run
      # 31006334399). A "best-effort" job that is supposed to SKIP when the tool
      # is missing instead failed the whole run.
      #
      # LLVM ships the binary as `llvm-bolt` (apt.llvm.org's `bolt-<N>` packages)
      # or versioned under /usr/lib/llvm-<N>/bin, so search all of those and
      # export the directory on PATH for `cargo pgo`, which resolves `llvm-bolt`
      # by name. Verifying the binary exists is what makes the skip honest.
      - name: Probe for llvm-bolt
        id: bolt_probe
        run: |
          # NOT `set -e`: this step probes for things that are allowed to be
          # absent. A missing tool must SKIP the stage, not fail the run.
          set -uo pipefail
          # PURE discovery: echoes the path of an llvm-bolt binary, or nothing.
          # It does not install, symlink, or otherwise touch the host — a probe
          # that mutates state as a side effect of looking is hard to reason
          # about and hard to re-run. Linking is a separate, explicit step below.
          #
          # ENUMERATE the versioned installs rather than probing a fixed version
          # window: a hard-coded `for v in 21 .. 16` reports "not found" on any
          # image shipping a version outside it, indistinguishable from "BOLT is
          # not installed" — the failure mode this whole probe exists to
          # eliminate. Globs that match nothing expand to the literal pattern,
          # which the `-x` test rejects.
          find_bolt_bin() {
            if command -v llvm-bolt >/dev/null 2>&1; then
              command -v llvm-bolt; return 0
            fi
            for cand in /usr/bin/llvm-bolt-* /usr/local/bin/llvm-bolt-* \
                        /usr/lib/llvm-*/bin/llvm-bolt; do
              [ -x "${cand}" ] || continue
              printf '%s\n' "${cand}"; return 0
            done
            return 1
          }

          # cargo-pgo resolves the UNVERSIONED name, so a versioned hit needs a
          # symlink. Kept separate from discovery, and reporting failure rather
          # than assuming success: without the `|| return 1` and the
          # executability re-check, a FAILED link still yielded a directory and
          # a success status — the same "assume it worked" bug, one level down.
          link_bolt() {
            _bin="$1"
            case "${_bin}" in
              */llvm-bolt) dirname "${_bin}"; return 0 ;;   # already unversioned
            esac
            sudo ln -sf "${_bin}" /usr/local/bin/llvm-bolt || return 1
            [ -x /usr/local/bin/llvm-bolt ] || return 1
            echo /usr/local/bin
          }

          find_bolt() {
            _found="$(find_bolt_bin)" || return 1
            link_bolt "${_found}"
          }

          bolt_dir="$(find_bolt || true)"
          if [ -z "${bolt_dir}" ]; then
            # Try to install it, then LOOK AGAIN — an install succeeding proves
            # nothing about which project's `bolt` landed on disk.
            sudo apt-get update >/dev/null 2>&1 || true
            # Candidate package names only — the loop re-probes after EACH one
            # and stops at the first that actually yields a binary, so an
            # unlisted name costs a skip, never a false positive.
            for pkg in llvm-bolt bolt-21 bolt-20 bolt-19 bolt-18 bolt-17 \
                       llvm-21-tools llvm-20-tools llvm-19-tools llvm-18-tools; do
              sudo apt-get install -y --no-install-recommends "$pkg" >/dev/null 2>&1 || continue
              bolt_dir="$(find_bolt || true)"
              [ -n "${bolt_dir}" ] && break
            done
          fi

          # Finding the BINARY is necessary but NOT sufficient. `llvm-bolt
          # --instrument` links a runtime archive, libbolt_rt_instr.a, which it
          # resolves relative to its OWN location (<prefix>/lib/). Run
          # 31062655291 located the binary, ran the whole analysis, and then died
          # with `BOLT-ERROR: library not found: /usr/lib/libbolt_rt_instr.a` —
          # the packaging ships the tool without the runtime where BOLT looks for
          # it. This is the same mistake as the original `apt-get install bolt`
          # check one level down: verifying one necessary condition and treating
          # it as sufficient. Verify the runtime too, link it into place when it
          # exists elsewhere, and otherwise skip — so `have_bolt=true` means
          # "BOLT can actually instrument", not "a file called llvm-bolt exists".
          if [ -n "${bolt_dir}" ]; then
            bolt_bin="$(command -v llvm-bolt || echo "${bolt_dir}/llvm-bolt")"
            rt_expected="$(dirname "$(dirname "${bolt_bin}")")/lib/libbolt_rt_instr.a"
            if [ ! -f "${rt_expected}" ]; then
              rt_found="$(find /usr/lib /usr/local/lib /usr/lib64 \
                            -name libbolt_rt_instr.a 2>/dev/null | head -1)"
              if [ -n "${rt_found}" ]; then
                sudo mkdir -p "$(dirname "${rt_expected}")"
                sudo ln -sf "${rt_found}" "${rt_expected}"
                echo "linked BOLT runtime ${rt_found} -> ${rt_expected}" \
                  >> "$GITHUB_STEP_SUMMARY"
              else
                bolt_dir=""
                echo "llvm-bolt present but libbolt_rt_instr.a is not installed —" \
                  "skipping BOLT stage." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi

          if [ -n "${bolt_dir}" ]; then
            echo "${bolt_dir}" >> "$GITHUB_PATH"
            echo "have_bolt=true" >> "$GITHUB_OUTPUT"
            echo "llvm-bolt ready: $(command -v llvm-bolt || echo "${bolt_dir}/llvm-bolt")" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "have_bolt=false" >> "$GITHUB_OUTPUT"
            echo "BOLT unavailable on this runner — skipping BOLT stage." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Re-run PGO so BOLT chains onto a fresh PGO binary (artifacts from the
      # pgo job are intentionally not BOLT-instrumentable post-strip).
      - name: PGO instrument + train + optimized rebuild
        if: steps.bolt_probe.outputs.have_bolt == 'true'
        env:
          PGO_FRAMES: ${{ inputs.frames || '3600' }}
        run: scripts/pgo/run.sh "$PGO_FRAMES"

      - name: Plain baseline bench
        if: steps.bolt_probe.outputs.have_bolt == 'true'
        run: |
          cargo bench -p rustynes-core --bench full_frame -- \
            --warm-up-time 1 --measurement-time 5 --save-baseline plain
          est="target/criterion/nes_run_frame_nestest/plain/estimates.json"
          echo "BASE_NS=$(python3 -c "import json,sys;print(int(json.load(open(sys.argv[1]))['mean']['point_estimate']))" "$est")" >> "$GITHUB_ENV"

      - name: BOLT instrument + optimize
        if: steps.bolt_probe.outputs.have_bolt == 'true'
        env:
          PGO_FRAMES: ${{ inputs.frames || '3600' }}
        run: |
          cargo pgo bolt build -- -p rustynes-frontend
          scripts/pgo/run.sh "$PGO_FRAMES"
          cargo pgo bolt optimize -- -p rustynes-frontend

      # DISABLED (v2.3.1) — these two steps cannot measure what they claim, and
      # one of them silently reported a fabricated number. Run 31067782333 is the
      # evidence: the probe and runtime fixes above made BOLT genuinely work
      # (instrument + optimize both succeeded for the first time), which finally
      # exposed what the gate downstream was doing.
      #
      # 1. `cargo pgo bolt optimize` takes NO cargo subcommand. Its usage is
      #    `cargo pgo bolt optimize [OPTIONS] [-- <CARGO_ARGS>...]`, unlike
      #    `cargo pgo optimize` (the PGO side) which does accept `bench`/`test`.
      #    Both steps were written by analogy with the PGO stage and both are
      #    rejected: `unexpected argument 'bench' found` / `'test' found`.
      #
      # 2. The bench step swallowed that with `|| cargo bench ...`, so it fell
      #    back to a PLAIN (non-BOLT) build, computed a speedup against the plain
      #    baseline, and wrote it to the summary as "BOLT speedup vs plain
      #    release". It compared plain against plain. The step reported SUCCESS.
      #    Had that ratio landed above the 3% bar, the gate would have promoted a
      #    BOLT binary on a measurement containing no BOLT.
      #
      # 3. Even with the CLI corrected, the design does not hold: BOLT optimizes
      #    the `rustynes` FRONTEND binary, while the gate benches
      #    `rustynes-core`'s `full_frame` criterion bench — a different binary
      #    BOLT never touched. Measuring BOLT honestly needs a harness that runs
      #    inside the optimized artifact (`frame_probe` built as part of it), not
      #    a core bench built separately.
      #
      # Left disabled rather than patched: a gate that cannot measure its subject
      # is worse than no gate, and #2 shows this one could actively mislead. The
      # instrument/optimize steps above still prove BOLT runs end to end, and the
      # artifact is still produced. Re-enable behind a harness that benches the
      # BOLT-optimized binary itself.
      - name: BOLT full_frame bench + gate
        if: false
        run: |
          echo "disabled — see the comment above (run 31067782333)"

      - name: Determinism oracle (BOLT codegen)
        if: false
        run: |
          echo "disabled — see the comment above (run 31067782333)"

      # The artifact must be the BOLT output, not whatever `rustynes` happens to
      # be sitting in target/. `path: target/**/release/rustynes` matched the
      # PGO binary that `scripts/pgo/run.sh` had already written, so an artifact
      # named `rustynes-pgo-bolt` contained NO BOLT — the same mislabelling as
      # the bench gate above, which reported a plain build as a BOLT speedup.
      #
      # `cargo pgo bolt optimize` writes `rustynes-bolt-optimized` alongside the
      # plain binary. `if-no-files-found: error` rather than `warn`: if the file
      # is absent the correct outcome is a visible failure, not a quietly empty
      # artifact that looks like a successful BOLT build.
      - name: Upload BOLT binary
        if: steps.bolt_probe.outputs.have_bolt == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rustynes-bolt-optimized
          path: target/**/release/rustynes-bolt-optimized
          if-no-files-found: error
