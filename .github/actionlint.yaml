# actionlint configuration (v2.3.9).
#
# The self-hosted runner label the Antigravity PR reviewer runs on. actionlint
# validates `runs-on` against the hosted-runner list and cannot know a custom
# label unless it is declared here, so without this it reports `agy` as unknown.
#
# Worth noting how this was found: the label check only started firing once this
# config file existed. Adding a linter config is not inert — it can activate
# checks that were dormant — so the first run after introducing one is where the
# real inventory appears, not the run before.
self-hosted-runner:
  labels:
    - agy

# One suppression, scoped to one file and one message.
#
# `pgo.yml` carries two steps deliberately disabled with `if: false`, each with a
# written rationale above it: the BOLT bench and determinism gates were switched
# off because the harness benches the wrong binary, and "a gate that cannot
# measure its subject is worse than no gate". The steps are kept rather than
# deleted so the shape survives for whoever re-enables them behind a harness that
# benches the BOLT-optimized binary itself.
#
# actionlint's `if-cond` rule flags a constant condition, which is correct in
# general and wrong about intent here.
#
# THE COST, stated rather than buried: this silences the rule for the whole
# file, so a genuinely accidental `if: false` added to `pgo.yml` later would not
# be caught. actionlint has no line-scoped ignore, and the alternatives are worse
# — deleting the steps loses the documented shape, and rewriting the condition to
# something non-constant hides the intent from the reader to satisfy a linter.
# Every other workflow keeps the rule.
paths:
  .github/workflows/pgo.yml:
    ignore:
      - 'constant expression "false" in condition'
