---
version: 2
updates:
  # Maintain Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "doublegate"
    assignees:
      - "doublegate"
    # HOLD the egui tier. A comment in `Cargo.toml` explains WHY the pin exists,
    # but a comment does not reach Dependabot -- it would keep re-opening the
    # same three PRs every Monday, and the risk is not the noise, it is that the
    # twentieth identical PR gets merged on the assumption it is routine.
    #
    # `egui-winit` 0.36.1 does not compile for `wasm32-unknown-unknown`, and
    # RustyNES ships a wasm demo:
    #
    #   error[E0407]: method `bytes` is not a member of trait `egui::DroppedFile`
    #
    # egui 0.36 split `DroppedFile` by target (`bytes_async` on wasm, `bytes` on
    # native) while egui-winit's `NativeFile` impl has no cfg gate, so on wasm it
    # implements a method the trait does not declare and omits the one it does.
    # `wgpu` is held with them only because `egui-wgpu` 0.35 pins it.
    #
    # REMOVE ALL FOUR ENTRIES once upstream ships the fix -- this is a hold, not
    # a policy. Re-check by bumping and running both wasm clippy invocations.
    ignore:
      - dependency-name: "egui"
        versions: [">=0.36"]
      - dependency-name: "egui-wgpu"
        versions: [">=0.36"]
      - dependency-name: "egui-winit"
        versions: [">=0.36"]
      - dependency-name: "wgpu"
        versions: [">=30"]
      # `naga` is a DIRECT dependency of `rustynes-frontend` (WGSL validation),
      # not merely a wgpu transitive, so Dependabot would propose 30 on its own
      # and the hold would be broken from a direction the four entries above do
      # not cover. Caught in review on the v2.6.3 refresh.
      - dependency-name: "naga"
        versions: [">=30"]
    # Group minor and patch updates together
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Maintain the Android build's Gradle tier.
  #
  # Added with the v2.6.3 dependency refresh, because that refresh could not
  # safely hand-bump it: the Android Gradle Plugin, the Gradle wrapper, AGP's
  # bundled Kotlin plugin and `androidx.baselineprofile` are an INTERLOCKED set,
  # each pin carrying its own written reason, and none of them is verifiable
  # without an Android SDK + NDK. The versions themselves are deliberately NOT
  # repeated here -- `android/build.gradle.kts` and
  # `android/gradle/wrapper/gradle-wrapper.properties` are the sources of truth,
  # and a copy in a comment is a copy that goes stale. Dependabot proposes them
  # ONE AT A TIME against a CI job that actually builds, which is the only
  # mechanism that makes such a bump checkable rather than hopeful.
  #
  # `android.yml` is deliberately NOT a required check -- accuracy is never
  # gated on a device toolchain -- so a red Android job blocks nothing and a
  # merged-anyway bump is the risk here. Read the job before merging one.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    reviewers:
      - "doublegate"
    assignees:
      - "doublegate"
