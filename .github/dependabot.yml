---
version: 2
updates:
  # Maintain Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    # The prefix carries no scope: `include: "scope"` appends `(deps)` (or
    # `(deps-dev)`) itself, so a `chore(deps)` prefix titled every PR
    # `chore(deps)(deps): ...` until v3.0.1.
    commit-message:
      prefix: "chore"
      include: "scope"
    # No `reviewers:` key: GitHub retired it in 2025 in favour of CODEOWNERS
    # (github.blog changelog 2025-08-08), and `.github/CODEOWNERS` assigns
    # @doublegate to every path. Removed in v3.0.1.
    assignees:
      - "doublegate"
    # From 2026-09-12 to 2026-09-28 an `ignore` block here held egui,
    # egui-wgpu, egui-winit (`>=0.36`), wgpu and naga (`>=30`) at the 0.35 tier,
    # because egui-winit 0.36 did not compile for wasm32. The tier then moved to
    # 0.36 / wgpu 30 with egui-winit vendored (see `Cargo.toml`), and the hold
    # stayed behind until v3.0.1 -- silently blocking every later egui and wgpu
    # release. The coupling it protected is real, so it is now a GROUP instead.
    groups:
      # ONE PR FOR THE WHOLE TIER. `Cargo.toml` says these five move together:
      # `egui-wgpu` pins one wgpu major, a graph holding two wgpu majors fails
      # every device/queue handoff, and `naga` is a DIRECT dependency of
      # `rustynes-frontend` (WGSL validation) that must match wgpu's. Listed
      # FIRST, with no `update-types`, because Dependabot puts a dependency in
      # the first group it matches -- below the catch-all groups, a minor bump
      # of one of these would land alone in `production-dependencies`. Before
      # merging one: egui-winit is vendored (`vendor/egui-winit/VENDORED.md`),
      # and a bump past 0.36.2 bypasses that patch, so run both wasm clippy gates.
      egui-wgpu-tier:
        patterns:
          - "egui"
          - "egui-wgpu"
          - "egui-winit"
          - "wgpu"
          - "naga"
      # Group minor and patch updates together
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # Maintain the Android build's Gradle tier.
  #
  # Added with the v2.6.3 dependency refresh, because that refresh could not
  # safely hand-bump it: the Android Gradle Plugin, the Gradle wrapper, AGP's
  # bundled Kotlin plugin and `androidx.baselineprofile` are an INTERLOCKED set,
  # each pin carrying its own written reason, and none of them is verifiable
  # without an Android SDK + NDK. The versions themselves are deliberately NOT
  # repeated here -- `android/build.gradle.kts` and
  # `android/gradle/wrapper/gradle-wrapper.properties` are the sources of truth,
  # and a copy in a comment is a copy that goes stale. Dependabot proposes them
  # ONE AT A TIME against a CI job that actually builds, which is the only
  # mechanism that makes such a bump checkable rather than hopeful.
  #
  # `android.yml` is deliberately NOT a required check -- accuracy is never
  # gated on a device toolchain -- so a red Android job blocks nothing and a
  # merged-anyway bump is the risk here. Read the job before merging one.
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    # GROUP THE COUPLED ARTIFACTS. Dependabot raises one PR per artifact, and
    # three sets here move in lockstep or not at all -- which is not a tidiness
    # point, it is how a half-applied bump reaches `main`:
    #
    #   * AGP: `com.android.application` and `com.android.test` share a version
    #     coordinate, and only the first ever got a PR.
    #   * Baseline profiles: the `androidx.baselineprofile` plugin tracks
    #     `androidx.benchmark:benchmark-macro-junit4`.
    #   * Glance: `glance-appwidget` and `glance-material3` are one Jetpack
    #     library split across two artifacts.
    #
    # The Glance pair is the reason this block exists rather than a comment:
    # the v2.6.18 refresh, whose whole subject was un-desyncing coupled pins,
    # bumped `glance-material3` and left `glance-appwidget` behind. Caught in
    # review. A rule the tooling enforces beats a rule someone has to remember.
    groups:
      android-gradle-plugin:
        patterns:
          - "com.android.*"
      androidx-benchmark:
        patterns:
          - "androidx.benchmark:*"
          - "androidx.baselineprofile*"
      androidx-glance:
        patterns:
          - "androidx.glance:*"
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "chore"
      include: "scope"

  # `crates/rustynes-cosim` is EXCLUDED from the workspace on purpose (cargo
  # unifies features across a workspace build, and this crate mandatorily
  # enables two trace features that select a different per-dot loop -- see
  # `cosim_manifest_audit.rs`). An excluded package is not reachable from the
  # root manifest, so it carries its OWN `Cargo.lock` and the "/" entry above
  # has never updated it. Found at the v2.6.18 refresh with four crates drifted
  # and nothing watching them. The exclusion is deliberate and stays; the
  # blind spot it created does not.
  - package-ecosystem: "cargo"
    directory: "/crates/rustynes-cosim"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    assignees:
      - "doublegate"
