# cargo-deny configuration for RustyNES
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# The prior RUSTSEC-2024-0436 (`paste`, via the old wgpu Metal backend) entry was
# dropped once the wgpu 29 / naga 29 bump removed `metal` (and thus `paste`) from
# the tree. Keep this list minimal — only "unmaintained"/"unsound" informational
# advisories on transitive deps with no safe upgrade; never suppress a real
# exploitable vulnerability.
#
# EVERY entry must carry the condition under which it expires, and must be
# removed once that condition is met. An ignore that has outlived its reason
# suppresses an advisory that does not apply today AND would suppress it again if
# a future resolve reintroduced the vulnerable version, with nobody looking.
# `cargo deny` flags an expired entry as `advisory-not-detected` ("no crate
# matched advisory criteria") — but that is a WARNING, not a failure, so it only
# surfaces to someone reading the output rather than the exit code.
ignore = [
    # `ttf-parser` unmaintained. NOT a vulnerability — an informational
    # "unmaintained" advisory. It is a pure transitive dep of `winit` (which the
    # workspace pins at 0.30.13) via its Wayland client-side-decoration font
    # stack: winit -> sctk-adwaita -> ab_glyph -> owned_ttf_parser -> ttf-parser
    # 0.25.1 (already the latest release). There is no safe upgrade until winit's
    # decoration stack moves off ab_glyph, so this cannot be resolved from our
    # manifest. Surfaced first by the egui-0.35 PR only because it is the first
    # PR to re-run the security workflow after the advisory was published; `main`
    # carries the identical `ttf-parser 0.25.1` and is affected equally. Revisit
    # when a future winit bump drops the ab_glyph/ttf-parser chain.
    "RUSTSEC-2026-0192",
    # webpki-roots (RUSTSEC-2026-0381, distrusted emSign roots), for the
    # 0.26.11 shim. cargo-deny can scope an ignore to one crate version only
    # for YANKED crates, so this is by ID and also mutes the advisory for 1.x;
    # `dependency_floor_audit` keeps that safe by failing if the lock ever
    # resolves webpki-roots 1.x below 1.0.10. 0.26.11 is the newest 0.26 release and a semver-trick shim: its whole
    # lib is `pub use parent::TLS_SERVER_ROOTS` with `parent` = webpki-roots
    # 1.x, which the lock resolves to 1.0.10, the fixed root set (120 roots,
    # one emSign root fewer than 1.0.9's 121; checked 2026-10-20). It is
    # pulled in by tungstenite 0.30.0 (the newest) for rustynes-netplay.
    # Expires when tungstenite depends on webpki-roots 1 directly, or if the
    # 1.x the shim resolves to is ever below 1.0.10.
    { id = "RUSTSEC-2026-0381", reason = "only webpki-roots 0.26.11, a shim re-exporting the fixed 1.0.10; dependency_floor_audit guards 1.x" },
    # basic-toml unmaintained (RUSTSEC-2026-0374, informational, not a
    # vulnerability). Reached only through uniffi 0.32.2 -> uniffi_bindgen ->
    # askama 0.16.1 -> askama_derive, a PROC-MACRO that reads askama's
    # template config at COMPILE time; no TOML from outside the build is ever
    # parsed with it, and it is not in any shipped binary's runtime. All
    # three are the newest releases (2026-10-20), so no manifest change
    # removes it. Expires when askama_derive (or uniffi) drops basic-toml.
    { id = "RUSTSEC-2026-0374", reason = "compile-time only, via uniffi's askama derive; no maintained replacement upstream yet" },
]

[licenses]
version = 2
# RustyNES itself is GPL-3.0-or-later (it incorporates code derived from GPL
# emulators — Mesen2 GPLv3, puNES/FCEUX/Nestopia GPLv2-or-later; see
# docs/originality-and-provenance.md and NOTICE). The permissive entries below
# remain allowed because they cover the third-party *dependency* graph, all of
# which is GPLv3-compatible.
allow = [
    "GPL-3.0-or-later", # RustyNES's own crates (derivative work of GPL emulators)
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",  # Used by unicode-ident crate
    # BSD family licenses (OSI approved, FSF Free/Libre, permissive)
    "BSD-2-Clause",  # Used by arrayref, av1-grain, rav1e, v_frame
    "BSD-3-Clause",  # Used by bindgen, exr, instant, lebe, ravif, tiny-skia
    # Other permissive licenses (OSI approved, FSF Free/Libre)
    "BSL-1.0",       # Boost Software License - used by clipboard-win, error-code
    "ISC",           # ISC License (similar to MIT) - used by inotify, libloading
    "Zlib",          # zlib License (permissive) - used by slotmap
    # Public-domain-equivalent (OSI/FSF, permissive)
    "CDLA-Permissive-2.0",  # Community Data License Permissive 2.0 - used by webpki-roots (<- ureq <- rustynes-cheevos)
    # Weak copyleft licenses (OSI approved, FSF Free/Libre, file-level copyleft)
    "MPL-2.0",       # Mozilla Public License 2.0 - used by option-ext, resvg, usvg
    # Font licenses (OSI approved, FSF Free/Libre) - used by egui/epaint default fonts
    "OFL-1.1",       # SIL Open Font License 1.1 - used by epaint_default_fonts
    "Ubuntu-font-1.0",  # Ubuntu Font Licence 1.0 - epaint_default_fonts (egui 0.32) declares this SPDX id for its bundled default font
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
# Allow duplicate versions since they're caused by transitive dependencies from major
# frameworks (iced, wgpu, image) that require different versions of common crates.
# These duplicates are unavoidable until upstream crates converge on versions.
# Examples: ahash, bitflags, block2, calloop, dirs-sys, fontdb, getrandom, etc.
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
